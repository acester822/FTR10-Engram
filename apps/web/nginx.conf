server {
    listen 80;

    # Serve static frontend files
    root /usr/share/nginx/html;
    index index.html;

    error_log /var/log/nginx/error.log warn;

    # Proxy API requests to the Engram backend
    location /api/ {
        proxy_pass http://engram:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support (for streaming responses)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # v4.7.10: manual scoring / judge calls can exceed the 60s default
        # (judge cold-loads ~19s under llama-swap swap groups + generation).
        # Without these, nginx returned a 504 HTML page and the GUI threw
        # 'Unexpected token <' trying to JSON.parse it.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback — let the frontend router handle unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
